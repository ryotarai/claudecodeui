name: Build

on:
  push:
    tags:
      - 'v*'
      - 'ryotarai-v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /claudecodeui
      - name: Package Build
        run: tar -czf claudecodeui-dist.tar.gz dist
      - name: Create Release
        uses: softprops/action-gh-release@a06a81a
        with:
          files: claudecodeui-dist.tar.gz
